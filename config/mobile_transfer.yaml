# Cross-station rack_1 -> rack_2 workflow.
# Keep both confirmation locks false until the loaded camera pose and complete
# chassis route have passed supervised, low-speed validation.

schema_version: mobile_tube_transfer.v1
# Arm-only phase gate: rack_1 pick -> loaded home -> source-empty verification.
pick_home_confirmed: true
# The source rack may shift when the arm returns with the tube. The next
# station is rescanned from scratch, so do not block transport on this check.
verify_pick_after_home: false
# After rack_2 placement is verified, keep the right arm at loaded home and
# undo the chassis route back to the robot's starting position.
return_to_start_after_transfer: true
confirmed: true

racks:
  source: rack_1
  destination: rack_2

# This one pose is both the chassis-safe loaded transport pose and the wrist
# camera pose used to verify a rack while holding a tube. The held tube must be
# outside the rack polygon while all four screws and the K0 marker stay visible.
loaded_observation_pose:
  position_mm: [94.238, 272.663, 133.168]
  rpy_rad: [-2.299, -0.012, -1.565]
  confirmed: true

chassis:
  # Use the 0.30 m forward distance requested for the current
  # pick_rotate_forward task. Keep the complete
  # mobile route locked until this value is supervised on the final floor.
  rotation_deg: 180.0
  translation_x_m: 0.30
  rotation_speed_radps: 0.08
  translation_speed_mps: 0.03
  yaw_tolerance_deg: 1.0
  position_tolerance_m: 0.012
  maximum_rotation_translation_m: 0.03
  timeout_s: 60.0
  helpers:
    # Keep the runtime helpers inside the isolated project environment.
    rotate_helper_path: "/home/rm/tubeGrabber-mobile-current/tools/agv_debug_tools/grabber_rotate_relative"
    pose_servo_path: "/home/rm/tubeGrabber-mobile-current/tools/agv_debug_tools/grabber_pose_servo"
