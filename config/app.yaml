# Final project configuration. Positions use mm; angles use rad.

runtime:
  # fake: no hardware; real: D435 + RealMan arm + gripper
  # Keep fake until every item in docs/LAB_CHECKLIST.md has passed.
  mode: fake
  require_enter_before_motion: true
  save_debug_images: true
  observation_position_tolerance_mm: 5.0
  observation_orientation_tolerance_deg: 2.0
  scene_recheck_pixel_tolerance_px: 5.0
  scene_recheck_position_tolerance_mm: 2.0
  scene_recheck_plane_tolerance_mm: 2.0
  # Wrist view above the destination cannot see all four rack screws while a
  # tube is held. Reuse the last complete pre-grasp scan for placement.
  destination_recheck_while_carrying: false

agent:
  # local: offline parser for canonical rack_1.r1c1 addresses
  # gemini: natural-language parser; reads the key from GEMINI_API_KEY
  provider: local
  model: "gemini-3.5-flash"
  api_key_env: "GEMINI_API_KEY"

camera:
  serial: "405622073249"
  width: 1280
  height: 720
  fps: 30
  warmup_frames: 60
  timeout_ms: 20000
  depth_min_mm: 100
  depth_max_mm: 1200

arm:
  ip: "169.254.128.19"
  port: 8080
  expected_dof: 7
  work_frame: "Base"
  # Built-in flange frame. The project applies its own flange -> gripper TCP offset.
  tool_frame: "Arm_Tip"
  reject_conflicting_processes: true
  conflicting_processes: [atom, zhixing_ctrl.py]
  transit_speed_percent: 15
  approach_speed_percent: 10

gripper:
  # 2026-07-28/2026-08-15 真机验证：ZX 1DOF RM Plus 只在 9600 在线。
  baudrate: 9600
  tool_voltage: 3
  speed: 100
  force: 30
  open_position: 170
  grip_position: 135
  reset_position: 1
  command_timeout_s: 5
  position_tolerance: 8
  poll_interval_s: 0.1
  state_read_attempts: 6
  state_read_retry_s: 0.25
  power_on_wait_s: 1.0
  protocol_startup_wait_s: 0.8

vision:
  # Final deployment uses the first local CUDA GPU. doctor rejects real mode
  # if CUDA-enabled PyTorch or the GPU is unavailable; there is no CPU fallback.
  device: "0"
  cap:
    model_path: "models/cap.pt"
    class_names:
      # The supplied weight metadata uses the generic training class `item`.
      0: item
    # Temporary low-confidence threshold for the current tilted orange tube.
    confidence: 0.10
    iou: 0.45
    image_size: 1280
    depth_window_px: 7
    maximum_height_error_mm: 6.0
  screw:
    model_path: "models/screw.pt"
    class_names:
      0: item
    confidence: 0.40
    iou: 0.45
    # screw.pt was trained/refined at native 1920 resolution.
    image_size: 1920
    minimum_rack_area_px2: 20000
    maximum_opposite_side_ratio: 1.35
    marker:
      # Extra white marker beside K0; screw boxes themselves are masked first.
      # Keep the tape isolated on the green rack instead of touching the white base.
      minimum_value: 145
      maximum_saturation: 100
      search_radius_factor: 0.45
      screw_exclusion_scale: 1.30
      minimum_area_px2: 18
      maximum_area_ratio: 4.0
      minimum_score_ratio: 1.25
      minimum_rack_aspect_ratio: 1.50
  calibration:
    # Click near each endpoint slot; Hough fit supplies the initial circle.
    search_radius_px: 70
    minimum_radius_px: 8
    maximum_radius_px: 45
    default_radius_px: 22
    hough_dp: 1.2
    hough_min_distance_px: 14.0
    hough_edge_threshold: 100.0
    hough_accumulator_threshold: 16.0
  stability:
    # Keep a wide capture window, accept any complete frame, and let the
    # mobile pick-home coordinator immediately resample visual failures.
    capture_frames: 12
    minimum_inlier_frames: 1
    maximum_frame_residual_px: 3.0
    maximum_keypoint_spread_px: 3.0
    minimum_occupancy_agreement: 0.70
    maximum_slot_position_spread_mm: 2.5
    maximum_cap_position_spread_mm: 3.0
  plane:
    sample_stride_px: 8
    roi_margin_px: 8
    landmark_exclusion_radius_px: 10
    ransac_iterations: 300
    inlier_threshold_mm: 2.0
    minimum_inliers: 250
    minimum_inlier_ratio: 0.35
    maximum_rms_error_mm: 1.5
    # Controller rm_get_install_pose reports y=45 deg.  In base_right this is
    # the physical rack-up direction (toward the wrist camera), not base +Z.
    expected_normal_base: [-0.70710678, 0.0, 0.70710678]
    maximum_tilt_deg: 8.0
  matching:
    # Current observation geometry has about 91 px slot spacing.  0.68 gives
    # an approximately 62 px gate, covering the measured 58.8 px offset while
    # retaining multi-frame occupancy and 3-D height validation.
    cap_slot_max_distance_factor: 0.68

racks:
  rack_1:
    calibration_path: "config/racks/rack_1.yaml"
  rack_2:
    calibration_path: "config/racks/rack_2.yaml"

geometry:
  hand_eye_path: "config/hand_eye.yaml"
  # Tuned for the current rig. Every new installation must remeasure this
  # before setting motion.parameters_confirmed to true.
  tcp_offset_end_mm: [-3.000, -11.000, 220.000]
  # Keep placement aligned with the pick TCP until rack_2 is measured.
  destination_tcp_offset_end_mm: [-3.000, -11.000, 220.000]
  # Current-rig value. Remeasure with the final rack and seated tube.
  cap_top_above_rack_mm: 47.0
  # Operator-tuned grasp depth for the current tube cap and fingers.
  grasp_depth_below_cap_mm: 28.0
  # Positive: place shallower (farther from rack). Negative: place deeper.
  seating_adjust_mm: 0.0
  # Current-rig value; remeasure when the tube type changes.
  tube_total_length_mm: 120.0
  required_carried_clearance_mm: 30.0

motion:
  # Set true only after checking TCP offset, workspace and all rack-normal
  # motion heights on the physical right arm at low speed.
  parameters_confirmed: true
  # Keep the one-time command authorization, then run the validated waypoints
  # continuously without an Enter prompt before every step.
  confirm_each_step: false
  poses_path: "config/poses.yaml"
  approach_height_mm: 50.0
  # 150 mm keeps the carried tube away from neighbouring caps during transfer.
  retreat_height_mm: 150.0
  # Reused from the proven AprilTag global-observation move gate.
  maximum_single_orientation_change_deg: 30.0
  # Same gate as the proven AprilTag planner: only a small correction from the
  # current tool axis to the measured rack normal is allowed.
  maximum_tool_axis_misalignment_deg: 15.0
  maximum_single_move_mm: 500.0
  # Reached-pose checks are disabled for continuous supervised lab execution.
  # The SDK move call remains blocking and controller errors still stop motion.
  reached_check_settle_s: 1.0
  verify_reached_each_waypoint: false
  position_reached_tolerance_mm: 4.0
  orientation_reached_tolerance_deg: 0.5
  # r1c1 retreat reached X=-53.14 mm; keep margin around that measured path.
  workspace_min_mm: [-80.0, 270.0, -110.0]
  workspace_max_mm: [250.0, 435.0, 200.0]
